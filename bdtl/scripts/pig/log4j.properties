# Quiet Pig console: keep job progress, job statistics and errors; hide routine INFO noise.
log4j.rootLogger=WARN, A1
log4j.appender.A1=org.apache.log4j.ConsoleAppender
log4j.appender.A1.target=System.err
log4j.appender.A1.layout=org.apache.log4j.PatternLayout
log4j.appender.A1.layout.ConversionPattern=%d{HH:mm:ss} [%p] %c{1} - %m%n
log4j.logger.org.apache.pig.backend.hadoop.executionengine.mapReduceLayer.MapReduceLauncher=INFO
log4j.logger.org.apache.pig.tools.pigstats.mapreduce.SimplePigStats=INFO
log4j.logger.org.apache.pig.backend.hadoop.executionengine.HExecutionEngine=INFO
log4j.logger.org.apache.pig.Main=INFO
log4j.logger.org.apache.hadoop.util.NativeCodeLoader=ERROR
log4j.logger.org.apache.hadoop.mapreduce.v2.app=ERROR
